# Builds the release APK and publishes it to GitHub Releases.
#
#   - Push a tag like v0.2.0  → tests, signed release APK, GitHub Release "v0.2.0" with the APK attached.
#   - Run manually (Actions → Release APK → Run workflow) → same build, APK kept as a workflow
#     artifact only; tick "publish" to also create a Release from the chosen ref.
#
# Signing uses four repository secrets (Settings → Secrets and variables → Actions); see README.md,
# "Releases on GitHub":
#   DITHER_KEYSTORE_BASE64   the release keystore file, base64-encoded
#   DITHER_STORE_PASSWORD    its password
#   DITHER_KEY_ALIAS         the key's alias
#   DITHER_KEY_PASSWORD      the key's password (may equal the store password)
# Publishing refuses to run without them: an APK signed with a throwaway key could never be updated.
# A manual run without "publish" falls back to the runner's debug key, for trying the build only.
name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Create a GitHub Release from this ref (needs the signing secrets)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then name="${GITHUB_REF_NAME#v}"; else name="0.0.0-$(git rev-parse --short HEAD)"; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Version $name (code ${GITHUB_RUN_NUMBER})"

      - name: Signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.DITHER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "DITHER_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [ "$PUBLISH" = "true" ]; then
            echo "::error::Publishing needs the signing secrets (see README.md, Releases on GitHub)."
            exit 1
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing secrets: this APK is signed with a throwaway debug key and is for trying only."
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest

      - name: Release APK
        env:
          DITHER_STORE_PASSWORD: ${{ secrets.DITHER_STORE_PASSWORD }}
          DITHER_KEY_ALIAS: ${{ secrets.DITHER_KEY_ALIAS }}
          DITHER_KEY_PASSWORD: ${{ secrets.DITHER_KEY_PASSWORD }}
        run: |
          extra=""
          if [ "${{ steps.signing.outputs.signed }}" != "true" ]; then extra="-PdebugSignRelease"; fi
          ./gradlew --no-daemon :app:assembleRelease $extra \
            -Pdither.versionName="${{ steps.version.outputs.name }}" \
            -Pdither.versionCode="${{ steps.version.outputs.code }}"
          apk="dither-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" | tee "$apk.sha256"
          echo "APK=$apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: |
            ${{ env.APK }}
            ${{ env.APK }}.sha256
          retention-days: 30

      - name: Publish the GitHub Release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then tag="${GITHUB_REF_NAME}"; else tag="build-${GITHUB_RUN_NUMBER}"; fi
          gh release create "$tag" "$APK" "$APK.sha256" \
            --target "${GITHUB_SHA}" \
            --title "Dither ${{ steps.version.outputs.name }}" \
            --generate-notes

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
